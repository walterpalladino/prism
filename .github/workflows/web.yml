# Builds the HTML5 (Web) export of PRISM.
#   - Push to main: publishes it to GitHub Pages (https://<user>.github.io/<repository>/).
#     One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   - Push a version tag (git tag v0.1.0 && git push origin v0.1.0): builds that version and publishes
#     a GitHub Release with the web build as a zip. The tag sets the version shown in About.
#
# The Web preset uses Godot's single-threaded template (variant/thread_support=false): threaded
# builds need cross-origin isolation headers (COOP/COEP), which GitHub Pages cannot send.
name: Web build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create releases on tags
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The full template bundle is ~1.3 GB; only the web template is kept, and cached.
      - name: Cache Godot and the web export template
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          curl -fsSL -o /tmp/templates.tpz "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$templates"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: sed -i "s/^config\/version=.*/config\/version=\"${GITHUB_REF_NAME#v}\"/" project.godot

      - name: Import the project
        run: ~/godot/godot --headless --path . --import

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm

      - uses: actions/configure-pages@v6
        if: github.ref_type == 'branch'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref_type == 'branch'
        with:
          path: build/web

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="prism-web-${GITHUB_REF_NAME}.zip"
          (cd build/web && zip -qr "$GITHUB_WORKSPACE/$archive" .)
          zip -qj "$archive" LICENSE CREDITS.md
          gh release create "$GITHUB_REF_NAME" "$archive" --title "PRISM $GITHUB_REF_NAME" --generate-notes --notes \
            "Web (HTML5) build. Play online at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ or unzip and serve the folder over HTTP (browsers do not run it from file://), e.g. \`python3 -m http.server\` and open http://localhost:8000."

  deploy:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
